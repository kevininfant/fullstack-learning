<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
        body{
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
        .card{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 500px;
        }
        .card h2{
            color: #333;
        margin-top: 0;
        text-align: center;
        }
        .feild{
            margin-bottom: 15px;
        }
        label{
            display: block;
            font-size: 14px;
            margin-bottom: 15px;
        }
         input{
            width: 100%;
            padding: 8px; 
            box-sizing: border-box;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }
        button{
            width: 100%;
            padding: 8px;
            box-sizing: border-border;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }
        button:hover{
            background-color: #ddd;
        }
    </style>
    <head>
        <title>login page</title>
    </head>
    <body>
        <div class="card">
            <h2>Login</h2>
<div class="feild">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username">
</div>
<div class="feild">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
</div>
<div class="feild">
    <button type="submit">Sign In</button>
</div>
        </div>
    </body>
</html>
